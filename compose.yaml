# Run everything through the wrapper scripts (course.sh / course.ps1 / course.cmd),
# or directly with: docker compose run --rm course <command>
name: building-agentic-ai

services:
  course:
    build:
      context: .
      args:                      # set GITHUB_MCP_IMAGE=nogithub in .env if ghcr.io is blocked
        GITHUB_MCP_IMAGE: ${GITHUB_MCP_IMAGE:-ghcr.io/github/github-mcp-server:latest}
    image: building-agentic-ai:latest
    env_file:
      - path: .env
        required: false
    environment:
      MODEL: ${MODEL:-claude-sonnet-5}
      COURSE_HOST_DIR: ${COURSE_HOST_DIR:-}
    user: "${COURSE_UID:-1000}:${COURSE_GID:-1000}"
    volumes:
      - ./workspace:/workspace
      - ./solutions:/solutions:ro        # solutions to every exercise and capstone
    working_dir: /workspace
    stdin_open: true
    tty: true
    ports:                       # published only with `run --service-ports`,
      - "127.0.0.1:6274:6274"    # and only to your own machine (127.0.0.1)
      - "127.0.0.1:6275:6275"    # MCP Inspector web UI + its sandbox page
      - "127.0.0.1:8000:8000"    # Streamable HTTP MCP servers (chapters 12 and 19)
      - "127.0.0.1:8080:8080"    # the agent API (chapter 19)

  # Isolated test runner for chapter 10: NO network, only the shared workspace.
  sandbox:
    image: building-agentic-ai:latest
    network_mode: none
    user: "${COURSE_UID:-1000}:${COURSE_GID:-1000}"
    volumes:                              # the workspace is READ-ONLY here; only the job
      - ./workspace:/workspace:ro         # queue is writable. Each job runs in a copy in /tmp.
      - ./workspace/.sandbox:/workspace/.sandbox
    pids_limit: 256                       # no fork bombs
    mem_limit: 2g
    cpus: 2
    working_dir: /workspace
    command: ["sandbox-worker"]
    read_only: true
    tmpfs:
      - /tmp
      - /home/student
    restart: unless-stopped
    profiles: ["sandbox"]

  # ---- Free local model (Appendix H): ./course.sh local up   then PROVIDER=local in .env
  # Ollama serves the open model (qwen3.5:9b by default). Models are kept in a volume, so
  # they download only once. Without a GPU it runs on the CPU.
  local-model:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: ${LOCAL_CONTEXT:-32768}   # Ollama's default (4k) is too small for agents
      OLLAMA_KEEP_ALIVE: 30m                           # keep the model loaded between runs
      OLLAMA_NUM_PARALLEL: "1"                         # one request at a time: best on a CPU
    ports:
      - "127.0.0.1:11434:11434"                        # only your own machine
    restart: unless-stopped
    profiles: ["local"]

  # Translates between the book's code (the Anthropic SDK) and Ollama, and fills the gaps:
  # forced tools, structured outputs, prompt caching. See course/local_adapter.py.
  local-adapter:
    image: building-agentic-ai:latest
    command: ["local-adapter"]
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://local-model:11434}
    user: "${COURSE_UID:-1000}:${COURSE_GID:-1000}"
    restart: unless-stopped
    profiles: ["local"]

volumes:
  ollama-models:
